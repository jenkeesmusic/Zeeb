[build]
  publish = "Public"
  command = ""

# Force redirect from Netlify subdomain to custom domain
[[redirects]]
  from = "https://zeebgame.netlify.app/*"
  to = "https://gamesbygrace.com/:splat"
  status = 301
  force = true

# Serve real files - these rules ensure actual files are served

[[redirects]]
  from = "/astroid-dodger/*"
  to = "/astroid-dodger/:splat"
  status = 200

[[redirects]]
  from = "/Islands/*"
  to = "/Islands/:splat"
  status = 200

[[redirects]]
  from = "/zeeb-show/*"
  to = "/zeeb-show/:splat"
  status = 200

[[redirects]]
  from = "/shared-assets/*"
  to = "/shared-assets/:splat"
  status = 200

[[redirects]]
  from = "/menu.css"
  to = "/menu.css"
  status = 200

[[redirects]]
  from = "/menu.js"
  to = "/menu.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Homepage only
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Everything else gets 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
