[build]
  publish = "Public"
  command = ""

# Block WordPress probing attacks
[[redirects]]
  from = "/wp-admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wordpress/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-content/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-includes/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/wp-login.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/xmlrpc.php"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.env"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/admin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/administrator/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/phpmyadmin/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/.git/*"
  to = "/404.html"
  status = 404

[[redirects]]
  from = "/config/*"
  to = "/404.html"
  status = 404

# Explicit passthrough for level pages and assets (serve real files first)
[[redirects]]
  from = "/level2/*"
  to = "/level2/:splat"
  status = 200

[[redirects]]
  from = "/level3/*"
  to = "/level3/:splat"
  status = 200

[[redirects]]
  from = "/level4/*"
  to = "/level4/:splat"
  status = 200

[[redirects]]
  from = "/start/*"
  to = "/start/:splat"
  status = 200

[[redirects]]
  from = "/zeeb-show/*"
  to = "/zeeb-show/:splat"
  status = 200

# SPA fallback: for unknown routes, serve root index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
