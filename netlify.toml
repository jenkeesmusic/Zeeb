[build]
  publish = "Public"
  command = ""

# Force redirect from Netlify subdomain to custom domain
[[redirects]]
  from = "https://zeebgame.netlify.app/*"
  to = "https://gamesbygrace.com/:splat"
  status = 301
  force = true

# Serve real files - these rules ensure actual files are served
[[redirects]]
  from = "/level2/*"
  to = "/level2/:splat"
  status = 200

[[redirects]]
  from = "/level3/*"
  to = "/level3/:splat"
  status = 200

[[redirects]]
  from = "/level4/*"
  to = "/level4/:splat"
  status = 200

[[redirects]]
  from = "/start/*"
  to = "/start/:splat"
  status = 200

[[redirects]]
  from = "/zeeb-show/*"
  to = "/zeeb-show/:splat"
  status = 200

[[redirects]]
  from = "/img/*"
  to = "/img/:splat"
  status = 200

[[redirects]]
  from = "/audio/*"
  to = "/audio/:splat"
  status = 200

# Root level files
[[redirects]]
  from = "/game.js"
  to = "/game.js"
  status = 200

[[redirects]]
  from = "/styles.css"
  to = "/styles.css"
  status = 200

[[redirects]]
  from = "/stars.js"
  to = "/stars.js"
  status = 200

[[redirects]]
  from = "/manifest.json"
  to = "/manifest.json"
  status = 200

[[redirects]]
  from = "/robots.txt"
  to = "/robots.txt"
  status = 200

# Homepage only
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

# Everything else gets 404
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404
