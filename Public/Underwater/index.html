<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zeeb Underwater</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b4f6c; }
  /* Explicit width and height on the canvas matter: the renderer is told not to
     touch the canvas style, so without these a 2x screen shows a magnified
     top-left quadrant. Same trap the waterfall lab hit. */
  #stage { position: fixed; inset: 0; display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; left: 0; right: 0; top: 0; padding: 18px 24px;
    display: flex; justify-content: space-between; align-items: flex-start;
    pointer-events: none; z-index: 5;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    color: #F4FBFF; text-shadow: 0 2px 10px rgba(0, 20, 40, 0.8);
  }
  #depth { font-size: 30px; font-weight: 800; letter-spacing: 0.02em; font-variant-numeric: tabular-nums; }
  #depth small { display: block; font-size: 17px; font-weight: 600; opacity: 0.8; letter-spacing: 0.08em; text-transform: uppercase; }
  #perf { font-size: 16px; opacity: 0.6; font-variant-numeric: tabular-nums; text-align: right; }
  #right { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; }
  #right .row { display: flex; gap: 10px; pointer-events: auto; }
  #right button {
    font: inherit; font-size: 21px; font-weight: 700; color: #F4FBFF;
    background: rgba(2, 30, 48, 0.72); border: 2px solid rgba(180, 230, 255, 0.55);
    border-radius: 12px; padding: 10px 18px; cursor: pointer; touch-action: manipulation;
    text-shadow: none;
  }
  #right button:active { background: rgba(2, 30, 48, 0.95); }
  #now { font-size: 18px; font-weight: 600; opacity: 0.85; text-align: right; }

  #hint {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    background: rgba(2, 30, 48, 0.72); color: #F4FBFF;
    border: 2px solid rgba(180, 230, 255, 0.45); border-radius: 16px;
    padding: 14px 22px; font-size: 21px; font-weight: 600; line-height: 1.4;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    pointer-events: none; z-index: 5; text-align: center; max-width: 92vw;
    transition: opacity 0.8s ease;
  }
  #hint.gone { opacity: 0; }
  /* ?preview hides the chrome so the homepage teaser shows only the ocean. */
  body.preview #hud, body.preview #hint { display: none; }
  #hint b { color: #FFD166; }

  #loading {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0b4f6c; color: #F4FBFF; z-index: 20;
    font-family: -apple-system, "Segoe UI", system-ui, sans-serif;
    font-size: 28px; font-weight: 700;
  }
</style>

<body>
<canvas id="stage"></canvas>

<div id="loading">Diving in...</div>

<div id="hud">
  <div id="depth"><small>Depth</small>0 ft</div>
  <div id="right">
    <div class="row">
      <button id="musicBtn" type="button">Music: On</button>
      <button id="nextBtn" type="button">Next song</button>
    </div>
    <div id="now">Tap the water to start the music</div>
    <div id="perf"></div>
  </div>
</div>
<div id="hint">
  <b>Arrow keys</b> or <b>WASD</b> to swim. <b>Space</b> rises, <b>Shift</b> dives. <b>M</b> for music.<br>
  On a touch screen, drag to steer. Swim through the stone rings.
</div>

<script>
  // Any startup crash goes onto the loading overlay: on a phone or iPad there
  // is no console to read.
  window.addEventListener('error', (e) => {
    const el = document.getElementById('loading');
    if (el) { el.style.display = 'flex'; el.style.fontSize = '18px'; el.textContent = 'Error: ' + e.message; }
  });
  window.addEventListener('unhandledrejection', (e) => {
    const el = document.getElementById('loading');
    if (el) { el.style.display = 'flex'; el.style.fontSize = '18px'; el.textContent = 'Error: ' + (e.reason && e.reason.message || e.reason); }
  });
</script>

<script type="importmap">
{
  "imports": {
    "three": "./vendor/three.module.min.js",
    "three/addons/": "./vendor/addons/"
  }
}
</script>

<script type="module">
/*
 * Zeeb Underwater: free swimming and the Reef Rally. Grace's Zeeb and fish
 * models swim through a procedural reef. reef-rally.js owns the game and
 * reef-world.js adds course landmarks around the original ocean.
 *
 * World units are feet. The sea floor sits about 60 ft down, the surface is
 * at 0, and Zeeb is about a foot long, which makes him a very small duck in
 * a very big sea. The depth readout on screen is simply minus his y.
 */
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import { MeshoptDecoder } from './vendor/meshopt_decoder.module.js';
import { createRally } from './reef-rally.js';
import { createReef } from './reef-world.js';
import { COURSE, COURSE_SCALE } from './reef-course.js';
import { createPilotCamera } from './zeeb-scooter.js';
import { createSwimControls } from './touch-controls.js';
import { CRUISE_SPEED, stepScooter } from './scooter-handling.js';
import { makeKelpGeometry, causticGLSL } from './reef-garden.js';
import { wreckFloor, inWreckFootprint } from './wreck-layout.js';

/* ----------------------------------------------------------------- layout */

const SURFACE_Y = 0;
const FLOOR_Y = -60;          // Mean sea floor height; the real floor undulates.
const WORLD_R = 250 * COURSE_SCALE; // Recovery space outside the wider rally.
const SPAWN = new THREE.Vector3(0, -36, 0);

// A seeded random generator so the ocean is laid out the same way on every
// visit. Once a child knows where the treasure chest is, it should stay put.
function mulberry32(seed) {
  return function () {
    seed |= 0; seed = (seed + 0x6D2B79F5) | 0;
    let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(20260902);
const rrange = (a, b) => a + rand() * (b - a);
const sandRoute=[SPAWN.toArray(),...COURSE];

// The sea floor blends waves and dunes with a shallower shelf along the rally.
// Terrain, scenery placement, and swimming limits share this height function.
function floorY(x, z) {
  let y = FLOOR_Y;
  y += 3.0 * Math.sin(x * 0.05) * Math.cos(z * 0.045);
  y += 2.0 * Math.sin(x * 0.13 + 1.0) + 1.5 * Math.cos(z * 0.11 + 2.0);
  y += 4.0 * Math.sin((x + z) * 0.02);
  y += 12.0 * Math.exp(-((x - 90) ** 2 + (z + 70) ** 2) / 2200);   // a tall dune
  y += 8.0 * Math.exp(-((x + 110) ** 2 + (z - 40) ** 2) / 3000);    // a lower one
  // A shallow garden shelf follows the rally, keeping the sand and small
  // plants visible beneath Zeeb instead of turning the reef into tall cliffs.
  let nearest=Infinity, shelfY=y;
  for(let i=1;i<sandRoute.length;i++) {
    const a=sandRoute[i-1],b=sandRoute[i],dx=b[0]-a[0],dz=b[2]-a[2];
    const t=THREE.MathUtils.clamp(((x-a[0])*dx+(z-a[2])*dz)/(dx*dx+dz*dz),0,1);
    const d=Math.hypot(x-a[0]-dx*t,z-a[2]-dz*t);
    if(d<nearest){nearest=d;shelfY=THREE.MathUtils.lerp(a[1],b[1],t)-11;}
  }
  y=THREE.MathUtils.lerp(y,shelfY+.35*Math.sin(x*.22)*Math.cos(z*.19),1-THREE.MathUtils.smoothstep(nearest,28,72));
  return wreckFloor(x,z,y,nearest);
}

/* --------------------------------------------------------------- renderer */

const canvas = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, matchMedia('(pointer: coarse)').matches ? 1.5 : 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
renderer.shadowMap.autoUpdate = false;

const scene = new THREE.Scene();
// The fog color and density change with depth every frame; these are just
// the starting values.
scene.fog = new THREE.FogExp2(0x0b4f6c, 0.012);
scene.background = new THREE.Color(0x0b4f6c);
// A soft light dome gives the sculpted plants broad highlights and water-colored
// reflections. It is baked once, so it adds no draw calls during the game.
{
  const lightDome=new THREE.Scene();
  const domeMaterial=new THREE.ShaderMaterial({side:THREE.BackSide,
    vertexShader:'varying vec3 direction; void main(){direction=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
    fragmentShader:'varying vec3 direction; void main(){vec3 d=normalize(direction);vec3 color=mix(vec3(.14,.19,.2),vec3(.7,.95,.91),smoothstep(-.6,.7,d.y));float glow=pow(max(0.,dot(d,normalize(vec3(-.4,.8,.25)))),18.);gl_FragColor=vec4(color+vec3(2.2,1.9,1.5)*glow,1.);}'});
  const domeGeo=new THREE.SphereGeometry(1,32,16);lightDome.add(new THREE.Mesh(domeGeo,domeMaterial));
  const pmrem=new THREE.PMREMGenerator(renderer);const reflection=pmrem.fromScene(lightDome,.03);
  scene.environment=reflection.texture;scene.environmentIntensity=.45;
  domeGeo.dispose();domeMaterial.dispose();pmrem.dispose();
}

const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 400 * COURSE_SCALE);

function resize() {
  const w = window.innerWidth, h = window.innerHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);
resize();

/* ----------------------------------------------------------------- lights */

const hemi = new THREE.HemisphereLight(0xe3fff4, 0xaaa0a6, .8);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffeed1, 3.1);
sun.position.set(20, 60, 10);
sun.castShadow = true;
sun.shadow.mapSize.set(1024, 1024);
Object.assign(sun.shadow.camera, { left: -62, right: 62, top: 62, bottom: -62, near: .5, far: 190 });
sun.shadow.bias = -.0006; sun.shadow.normalBias = .16;
sun.shadow.radius = 4; sun.shadow.blurSamples = 8;
const shadowAnchor = new THREE.Vector3(Infinity, Infinity, Infinity);
scene.add(sun.target);
scene.add(sun);

/* -------------------------------------------------------- canvas textures */

function canvasTexture(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  return t;
}


// A light shaft: bright at the top, gone by the bottom, soft at the sides.
const shaftTex = canvasTexture(64, 256, (g, w, h) => {
  g.clearRect(0, 0, w, h);
  const v = g.createLinearGradient(0, 0, 0, h);
  v.addColorStop(0, 'rgba(255,255,255,0.9)');
  v.addColorStop(0.5, 'rgba(255,255,255,0.35)');
  v.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = v;
  g.fillRect(0, 0, w, h);
  g.globalCompositeOperation = 'destination-in';
  const s = g.createLinearGradient(0, 0, w, 0);
  s.addColorStop(0, 'rgba(0,0,0,0)');
  s.addColorStop(0.5, 'rgba(0,0,0,1)');
  s.addColorStop(1, 'rgba(0,0,0,0)');
  g.fillStyle = s;
  g.fillRect(0, 0, w, h);
});

/* -------------------------------------------------- shared shader pieces */

// Every custom material below takes the scene fog through three's own
// chunks, so the whole ocean fades into the same blue the built-in
// materials use.
const fogUniforms = THREE.UniformsUtils.merge([THREE.UniformsLib.fog]);
const timeUniform = { value: 0 };

/* -------------------------------------------------------------- sea floor */

// Displaced sand receives soft shadows, a warm vertex-color tint, and
// animated caustics through a standard lit material.
{
  const SIZE = 620 * COURSE_SCALE, SEG = Math.ceil(220 * COURSE_SCALE);
  const geo = new THREE.PlaneGeometry(SIZE, SIZE, SEG, SEG);
  geo.rotateX(-Math.PI / 2);
  const pos = geo.attributes.position;
  const col = new Float32Array(pos.count * 3);
  // Grace's call: the sand matches her Zeeb Islands beaches. Sampled from
  // Islands/img/Level2/2-sand.png, the beach averages #f0d781 with #f0d080
  // as the dominant fill, so the ridges sit just above that and the dips a
  // shade deeper, still clearly yellow.
  // Final call: the color of the level-one islands. Island Left.svg fills its
  // sand with #f9c775 and highlights the edges with #fcd8a6, so the ridges
  // take the highlight and the dips sit a touch under the main fill.
  const sandLight = new THREE.Color(0xfcd8a6), sandDark = new THREE.Color(0xf2bb66);
  const tmp = new THREE.Color();
  for (let i = 0; i < pos.count; i++) {
    const x = pos.getX(i), z = pos.getZ(i);
    const y = floorY(x, z);
    pos.setY(i, y);
    // Broad warm variations with a little speckle.
    const k = .45+.25*Math.sin(x*.12)*Math.cos(z*.09);
    tmp.copy(sandDark).lerp(sandLight, k * 0.85 + rand() * 0.15);
    col[i * 3] = tmp.r; col[i * 3 + 1] = tmp.g; col[i * 3 + 2] = tmp.b;
  }
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.computeVertexNormals();

  const mat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: .94, metalness: 0,
    emissive: 0xe6bd72, emissiveIntensity: .09 });
  mat.onBeforeCompile = shader => {
    shader.uniforms.reefTime = timeUniform;
    shader.vertexShader = 'varying vec3 sandWorld;\n' + shader.vertexShader;
    shader.vertexShader = shader.vertexShader.replace('#include <begin_vertex>', '#include <begin_vertex>\n sandWorld=(modelMatrix*vec4(transformed,1.)).xyz;');
    shader.fragmentShader = 'varying vec3 sandWorld;\nuniform float reefTime;\n' + causticGLSL + shader.fragmentShader;
    shader.fragmentShader = shader.fragmentShader.replace('#include <color_fragment>', `#include <color_fragment>
      float ripple=sin(sandWorld.x*1.7+sandWorld.z*.45+sin(sandWorld.z*.32)*1.3);
      float grain=sin(sandWorld.x*21.3)*sin(sandWorld.z*24.7)*.018;
      diffuseColor.rgb *= .92+ripple*.035+grain;
      diffuseColor.rgb += reefCaustic(sandWorld.xz,reefTime)*vec3(.23,.20,.12);
    `);
  };
  mat.customProgramCacheKey = () => 'storybook-sand';
  const floor = new THREE.Mesh(geo, mat); floor.receiveShadow = true;
  scene.add(floor);
}

/* ------------------------------------------------------------ the surface */

// Seen from below, the surface is a bright rippling ceiling. Its vertices
// heave with a few slow waves and its brightness follows the wave slope, so
// it glitters as Zeeb moves under it.
let surfaceMat;
{
  const geo = new THREE.PlaneGeometry(1600, 1600, 120, 120);
  geo.rotateX(Math.PI / 2); // Face down toward the swimmer.
  surfaceMat = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uTime: { value: 0 } }]),
    fog: true,
    transparent: true,
    depthWrite: false,
    side: THREE.DoubleSide,
    vertexShader: `
      #include <fog_pars_vertex>
      uniform float uTime;
      varying float vGlint;
      varying vec3 vWorld;
      void main() {
        vec3 p = position;
        float t = uTime;
        float h = 0.0;
        h += sin(p.x * 0.08 + t * 0.9) * 0.8;
        h += sin(p.z * 0.11 - t * 0.7) * 0.6;
        h += sin((p.x + p.z) * 0.05 + t * 0.5) * 0.9;
        h += sin((p.x - p.z * 0.6) * 0.17 + t * 1.3) * 0.25;
        p.y += h;
        // Slope of the same waves, used as a fake normal for the glitter.
        float sx = cos(p.x * 0.08 + t * 0.9) * 0.064 + cos((p.x + p.z) * 0.05 + t * 0.5) * 0.045;
        float sz = cos(p.z * 0.11 - t * 0.7) * 0.066 + cos((p.x + p.z) * 0.05 + t * 0.5) * 0.045;
        vec3 n = normalize(vec3(-sx, 1.0, -sz));
        vGlint = pow(max(0.0, dot(n, normalize(vec3(0.2, 1.0, 0.1)))), 24.0);
        vec4 wp = modelMatrix * vec4(p, 1.0);
        vWorld = wp.xyz;
        vec4 mvPosition = viewMatrix * wp;
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      #include <fog_pars_fragment>
      ${causticGLSL}
      uniform float uTime;
      varying float vGlint;
      varying vec3 vWorld;
      void main() {
        float lace=reefCaustic(vWorld.xz*.6,uTime);
        vec3 col = vec3(.19,.64,.69)+vec3(.24,.29,.25)*lace+vGlint*.07;
        gl_FragColor = vec4(col, 0.75 + vGlint * 0.25);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`
  });
  surfaceMat.uniforms.uTime = timeUniform;
  const surface = new THREE.Mesh(geo, surfaceMat);
  surface.renderOrder = -10;
  surface.position.y = SURFACE_Y;
  scene.add(surface);
}

/* ---------------------------------------------------------- light shafts */

// Crossed additive planes hanging from the surface. They sway and breathe a
// little so the light looks alive rather than painted on.
const shafts = [];
{
  const mat = new THREE.MeshBasicMaterial({
    map: shaftTex, transparent: true, blending: THREE.AdditiveBlending,
    depthWrite: false, side: THREE.DoubleSide, opacity: 0.035, color: 0xbfefff
  });
  for (let i = 0; i < 26; i++) {
    const g = new THREE.Group();
    const w = rrange(4, 12), h = rrange(40, 70);
    for (const yaw of [0, Math.PI / 2]) {
      const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), mat);
      m.rotation.y = yaw;
      g.add(m);
    }
    const a = rand() * Math.PI * 2, r = rrange(10, 190);
    g.position.set(Math.cos(a) * r, SURFACE_Y - h / 2 + 1, Math.sin(a) * r);
    g.rotation.y = rand() * Math.PI;
    g.rotation.z = rrange(-0.12, 0.12);
    g.userData.phase = rand() * Math.PI * 2;
    g.userData.baseX = g.position.x;
    scene.add(g);
    shafts.push(g);
  }
}

/* ------------------------------------------------------------ kelp forest */

// Kelp is one InstancedMesh of curved blades with a vertex-shader sway.
// The sway grows with height squared, so the base stays rooted and the tips
// whip around. Each blade has its own phase so the forest never moves in
// lockstep.
{
  const geo = makeKelpGeometry();

  const COUNT = 170;
  const mesh = new THREE.InstancedMesh(geo, null, COUNT);
  const phases = new Float32Array(COUNT);
  const dummy = new THREE.Object3D();
  // Six kelp beds, each a loose ring of blades around a center.
  const beds = [];
  for (let b = 0; b < 6; b++) {
    const a = rand() * Math.PI * 2, r = rrange(35, 170);
    beds.push([Math.cos(a) * r, Math.sin(a) * r, rrange(14, 26)]);
  }
  for (let i = 0; i < COUNT; i++) {
    const [bx, bz, br] = beds[i % beds.length];
    const a = rand() * Math.PI * 2, r = Math.sqrt(rand()) * br;
    const x = bx + Math.cos(a) * r, z = bz + Math.sin(a) * r;
    const route = [SPAWN.toArray(), ...COURSE];
    const onCourse = route.some((p, j) => {
      if (!j) return false;
      const a=route[j-1], dx=p[0]-a[0], dz=p[2]-a[2];
      const t=THREE.MathUtils.clamp(((x-a[0])*dx+(z-a[2])*dz)/(dx*dx+dz*dz),0,1);
      return Math.hypot(x-a[0]-dx*t,z-a[2]-dz*t)<13;
    });
    const clear = onCourse || inWreckFootprint(x,z,6);
    const h = clear ? .02 : rrange(7, 12), w = clear ? .02 : rrange(2.5, 4);
    dummy.position.set(x, floorY(x, z) - 0.3, z);
    dummy.rotation.set(0, rand() * Math.PI * 2, 0);
    dummy.scale.set(w, h, 1);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
    phases[i] = rand() * Math.PI * 2;
  }
  geo.setAttribute('aPhase', new THREE.InstancedBufferAttribute(phases, 1));

  const colors=new Float32Array(geo.attributes.position.count*3);
  const low=new THREE.Color(0x287c79),high=new THREE.Color(0x9bc67d),color=new THREE.Color();
  for(let i=0;i<geo.attributes.position.count;i++) {
    color.copy(low).lerp(high,geo.attributes.uv.getY(i));colors.set([color.r,color.g,color.b],i*3);
  }
  geo.setAttribute('color',new THREE.BufferAttribute(colors,3));
  mesh.material = new THREE.MeshStandardMaterial({vertexColors:true,roughness:.56,side:THREE.DoubleSide});
  mesh.material.onBeforeCompile=shader=>{
    shader.uniforms.kelpTime=timeUniform;
    shader.vertexShader='uniform float kelpTime;\nattribute float aPhase;\n'+shader.vertexShader;
    shader.vertexShader=shader.vertexShader.replace('#include <begin_vertex>',
      '#include <begin_vertex>\n transformed.x+=sin(kelpTime*1.1+aPhase)*uv.y*uv.y*.22; transformed.z+=cos(kelpTime*.8+aPhase)*uv.y*uv.y*.16;');
  };
  mesh.name='Outer kelp beds';
  mesh.frustumCulled = false;
  scene.add(mesh);
}

// Preserve the source mesh colors when batching Grace's fish.
function tint(geo, hex, jitter = 0) {
  const c = new THREE.Color(hex);
  if (jitter) c.offsetHSL((rand() - 0.5) * jitter, 0, (rand() - 0.5) * jitter);
  const n = geo.attributes.position.count;
  const arr = new Float32Array(n * 3);
  for (let i = 0; i < n; i++) { arr[i * 3] = c.r; arr[i * 3 + 1] = c.g; arr[i * 3 + 2] = c.b; }
  geo.setAttribute('color', new THREE.BufferAttribute(arr, 3));
  return geo;
}

/* ------------------------------------------------------- exploration rings */

// Stone rings to swim through. Each stands on the sand, half its tube buried,
// and marks its spot with a soft glow so it can be found from a distance.
const rings = [];
{
  const spots = [[0, -40], [-55, 30], [70, 55], [-30, -95], [120, -20]];
  const mat = new THREE.MeshLambertMaterial({ color: 0x8aa0aa });
  for (const [x, z] of spots) {
    if(inWreckFootprint(x,z,8))continue;
    const R = rrange(5, 7);
    const ring = new THREE.Mesh(new THREE.TorusGeometry(R + .35, 1.45, 16, 48), mat);
    ring.position.set(x, floorY(x, z) + R - 0.6, z);
    ring.rotation.y = rand() * Math.PI;
    scene.add(ring);
    const glow = new THREE.PointLight(0x7fe3ff, 12, R * 4, 1.6);
    glow.position.copy(ring.position);
    scene.add(glow);
    rings.push({ mesh: ring, R, glow, hit: 0 });
  }
}

/* ------------------------------------------------------------ fish schools */

// Each school follows its own looping path; each fish keeps a home offset
// inside the school and wiggles along. When Zeeb gets close, fish are shoved
// away from him and then ease back home, which reads as the school parting
// around him.
// The fish is Grace's: her grey Zeeb Islands fish, modelled in Blender

// Flatten a loaded glTF scene into one vertex-colored geometry.
function bakeSceneToGeometry(root) {
  root.updateMatrixWorld(true);
  const parts = [];
  root.traverse((o) => {
    if (!o.isMesh) return;
    let g = o.geometry.clone();
    if (g.index) g = g.toNonIndexed();
    g.applyMatrix4(o.matrixWorld);
    // Only position, normal and color survive the merge; every part must
    // carry the same attribute set or mergeGeometries refuses.
    for (const name of Object.keys(g.attributes)) {
      if (name !== 'position' && name !== 'normal') g.deleteAttribute(name);
    }
    if (!g.attributes.normal) g.computeVertexNormals();
    const mats = Array.isArray(o.material) ? o.material : [o.material];
    parts.push(tint(g, mats[0].color ? mats[0].color.getHex() : 0x808080));
  });
  return mergeGeometries(parts);
}

// One bubble system for the ambient ocean and one for Zeeb's trail. Both are
// point clouds with a shader that draws a ring and a highlight, so they read
// as bubbles rather than dots.
function bubbleMaterial(color) {
  const m = new THREE.ShaderMaterial({
    uniforms: THREE.UniformsUtils.merge([THREE.UniformsLib.fog, { uColor: { value: new THREE.Color(color) } }]),
    fog: true, transparent: true, depthWrite: false,
    vertexShader: `
      #include <fog_pars_vertex>
      attribute float aSize;
      attribute float aAlpha;
      varying float vAlpha;
      void main() {
        vAlpha = aAlpha;
        vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
        gl_PointSize = aSize * (520.0 / max(1.0, -mvPosition.z));
        gl_Position = projectionMatrix * mvPosition;
        #include <fog_vertex>
      }`,
    fragmentShader: `
      #include <fog_pars_fragment>
      uniform vec3 uColor;
      varying float vAlpha;
      void main() {
        vec2 p = gl_PointCoord - 0.5;
        float d = length(p);
        if (d > 0.5) discard;
        float ring = smoothstep(0.30, 0.42, d) * (1.0 - smoothstep(0.44, 0.5, d));
        float hi = 1.0 - smoothstep(0.0, 0.12, length(p - vec2(-0.14, -0.14)));
        float a = (ring * 0.9 + hi * 0.9 + 0.08) * vAlpha;
        gl_FragColor = vec4(uColor, a);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
        #include <fog_fragment>
      }`
  });
  return m;
}

// Beach music: Grace's Zeeb Islands tracks, played straight from the Islands
// game folder. The audio runs through a lowpass filter whose cutoff follows
// Zeeb's depth, so a song is muffled down in the deep and opens up bright as
// he rises toward the surface. Browsers refuse to play sound before a user
// gesture, and a finger pressing down is not one yet (only the lift is), so
// playback starts on the first key press, mouse press, or finger lift, and
// every attempt is verified before the game believes music is playing.
const PLAYLIST = [
  ['The Drums Of Tiki', '../Islands/Audio/The Drums Of Tiki.m4a'],
  ['Coconut Island', '../Islands/Audio/level3_coconut_island.m4a'],
  ['Little Island of Zeeb', '../Islands/Audio/Little Island of Zeeb.m4a'],
  ['Pick Your Surfboard', '../Islands/Audio/Zeeb Islands - Pick Your Surfboard.m4a'],
  ['Zeeb Islands', '../Islands/Audio/Zeeb Islands level 1.m4a']
];
const music = {
  on: true,          // what the player asked for (Music button, M key)
  started: false,    // verified: play() went through and the graph is running
  starting: false,   // an attempt is in flight; extra taps are absorbed
  everPlayed: false, // wording only: "start" versus "resume"
  direct: false,     // play the element straight, no Web Audio graph (see musicStart)
  refusals: 0, index: 0, failures: 0, ctx: null, filter: null, el: null
};
const musicBtn = document.getElementById('musicBtn');
const nextBtn = document.getElementById('nextBtn');
const nowEl = document.getElementById('now');
const sleep = (ms, value) => new Promise((resolve) => setTimeout(() => resolve(value), ms));
// The graph is the part a browser can refuse to run; with no graph the
// element sounds on its own.
const graphRunning = () => !music.ctx || music.ctx.state === 'running';

function makeElement() {
  const el = new Audio();
  el.preload = 'auto';
  // Listeners ignore an element that musicDropGraph() has retired. Moving to
  // the next track only plays it while music is on; off, it just remembers
  // where to pick up.
  const advance = () => {
    if (music.on) musicPlay(music.index + 1);
    else music.index = (music.index + 1) % PLAYLIST.length;
  };
  el.addEventListener('ended', () => { if (music.el === el) advance(); });
  el.addEventListener('error', () => {
    if (music.el !== el) return;
    // Skip a track that will not load, but give up after one full lap so a
    // broken folder cannot spin forever.
    if (++music.failures < PLAYLIST.length) advance();
    else nowEl.textContent = 'Music files not found';
  });
  // Ground truth: the element is sounding into a running graph (or straight),
  // however long the file took to arrive.
  el.addEventListener('playing', () => {
    if (music.el !== el) return;
    music.failures = 0;
    if (music.on && graphRunning()) { music.started = true; music.everPlayed = true; music.refusals = 0; }
    musicLabel();
  });

  // the sound, a call): say so. Not for the pause that precedes ended.
  el.addEventListener('pause', () => { if (music.el === el && !el.ended && music.on && !document.hidden) musicLabel(); });
  return el;
}
function musicSetup() {

  // session, which the switch silences, while a playing media element moves
  // the page to "playback", which it does not. The track element should do
  // that on its own; since iOS 17 the page can also ask for it outright.
  if (navigator.audioSession) { try { navigator.audioSession.type = 'playback'; } catch (_) {} }

  // run. A browser without Web Audio just plays the element straight.
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const src = ctx.createMediaElementSource(music.el);
    const filter = ctx.createBiquadFilter();
    filter.type = 'lowpass';
    filter.frequency.value = 4000;
    filter.Q.value = 0.7;
    const gain = ctx.createGain();
    gain.gain.value = 0.7;
    src.connect(filter).connect(gain).connect(ctx.destination);
    ctx.addEventListener('statechange', musicLabel);

// Web Audio would not run here even after real gestures. Retire the graph and
// the element wired into it (once connected, an element only sounds through
// the graph) and continue the song on a plain element: no depth muffle, but
// music.
function musicDropGraph() {

// Names the song only while it is really sounding: element playing and the
// graph it feeds running. Otherwise it asks for a tap.

  const audible = music.el && !music.el.paused && graphRunning();
  nowEl.textContent = audible

// touchend), or a mouse press. Everything the browser gates on the gesture
// (creating the context, resume(), play()) runs synchronously before the
// first await so the gesture still counts. started becomes true only once
// play() went through and the graph reports running; otherwise it stays
// false, the element is paused so it never runs silently into a stopped
// graph, and the next gesture simply tries again.

  nowEl.style.opacity = music.on ? '' : '0.45';

});
window.addEventListener('keyup', (e) => keys.delete(e.code));
window.addEventListener('blur', () => keys.clear());

// Installed after the rally creates its UI; mouse and touch share one owner.
let controls;
function readInput(dt) {
  const pointer = controls.read(dt);
  let thrust = 0, turn = 0, rise = 0;
  if (keys.has('ArrowUp') || keys.has('KeyW')) thrust += 1;
  if (keys.has('ArrowDown') || keys.has('KeyS')) thrust -= 0.6;
  if (keys.has('ArrowLeft') || keys.has('KeyA')) turn += 1;
  if (keys.has('ArrowRight') || keys.has('KeyD')) turn -= 1;
  if (keys.has('Space') || keys.has('KeyE')) rise += 1;
  if (keys.has('ShiftLeft') || keys.has('ShiftRight') || keys.has('KeyQ')) rise -= 1;
  if (pointer.thrust < 0) thrust = pointer.thrust;
  else if (pointer.thrust > 0) thrust = Math.max(thrust, pointer.thrust);
  turn += pointer.turn;
  rise += pointer.rise;
  return { thrust, turn: THREE.MathUtils.clamp(turn, -1, 1), rise: THREE.MathUtils.clamp(rise, -1, 1) };
}

/* --------------------------------------------------------- swim physics */

// Zeeb responds promptly and follows his heading. Separate
// depth control and the rally's approach assistance keep hoop runs forgiving.
const swim = {
  vel: new THREE.Vector3(),
  yaw: 0, yawRate: 0,
  pitch: 0, bank: 0,
  speed: 0
};
const MAX_SPEED = CRUISE_SPEED;
const fwd = new THREE.Vector3();
const camPos = new THREE.Vector3(SPAWN.x, SPAWN.y + 3.5, SPAWN.z - 11);
const camLook = new THREE.Vector3().copy(SPAWN);
const tmpV = new THREE.Vector3();
const billPos = new THREE.Vector3();

const rally = createRally({ scene, camera, duck, swim, camPos, camLook, spawnBubble, musicStart, music,
  clearInput: () => { keys.clear(); controls?.clear(); } });
controls = createSwimControls({ canvas, mode: () => rally.state.mode, musicStart, dismissHint });
const touch = controls.pointer;
const reef = createReef({ scene, floorY, timeUniform, spawnBubble, duck, rally, onDiscover: rally.announce, reducedMotion: rally.reducedMotion });
const swimPrevious = new THREE.Vector3(), cameraOrigin = new THREE.Vector3();
// Follow reduced motion by default, but let the player explicitly choose the
// playful face-reveal camera independently of screen shake and boost zoom.
let playfulCamera = !rally.reducedMotion && !controls.touchMode;
try {
  const savedCamera = localStorage.getItem('zeeb-reef-camera');
  if (savedCamera === 'playful' || savedCamera === 'steady') playfulCamera = savedCamera === 'playful';
} catch {}
const cameraBtn = document.createElement('button');
cameraBtn.id = 'cameraBtn'; cameraBtn.type = 'button'; cameraBtn.style.pointerEvents = 'auto';
cameraBtn.title = 'Playful briefly shows Zeeb’s face during turns. Steady keeps the chase view.';
function labelCamera() {
  cameraBtn.textContent = 'Camera: ' + (playfulCamera ? 'Playful' : 'Steady');
  cameraBtn.setAttribute('aria-pressed', String(playfulCamera));
}
cameraBtn.addEventListener('click', () => {
  playfulCamera = !playfulCamera; pilotCamera.state.phase = 0; pilotCamera.state.cooldown = 0;
  try { localStorage.setItem('zeeb-reef-camera', playfulCamera ? 'playful' : 'steady'); } catch {}
  labelCamera();
});
document.getElementById('right').append(cameraBtn); labelCamera();

/* ---------------------------------------------------------------- the HUD */

const depthEl = document.getElementById('depth');
const perfEl = document.getElementById('perf');
let lastDepthShown = -1;

/* ------------------------------------------------------------ render loop */

let lastNow = performance.now();
let elapsed = 0;
let frames = 0, fpsTimer = 0;
const shallow = new THREE.Color(0x65e7e5), deep = new THREE.Color(0x26b0cc);
const fogNow = new THREE.Color();

function animate() {
  const now = performance.now();
  const dt = rally.state.mode === 'paused' ? 0 : Math.min((now - lastNow) / 1000, 0.05);
  lastNow = now;
  elapsed += dt;
  const t = elapsed;
  timeUniform.value = t;

  /* --- Zeeb --- */
  const inp = rally.beforeStep(readInput(dt), dt);
  const boosting = rally.state.boost > 0;

  stepScooter(swim, inp, boosting, dt);
  fwd.set(Math.sin(swim.yaw), 0, Math.cos(swim.yaw));

  swimPrevious.copy(duck.position);
  duck.position.addScaledVector(swim.vel, dt);
  if(dt>0)reef.wreck.resolveMovement(swimPrevious,duck.position,swim.vel);

  // Stay under the surface, above the sand, and inside the world.
  const sand = floorY(duck.position.x, duck.position.z) + 1.4;
  if (duck.position.y < sand) { duck.position.y = sand; if (swim.vel.y < 0) swim.vel.y *= -0.2; }
  if (duck.position.y > SURFACE_Y - 1.2) { duck.position.y = SURFACE_Y - 1.2; if (swim.vel.y > 0) swim.vel.y = 0; }
  const hr = Math.hypot(duck.position.x, duck.position.z);
  if (hr > WORLD_R) {
    tmpV.set(-duck.position.x, 0, -duck.position.z).normalize();
    swim.vel.addScaledVector(tmpV, (hr - WORLD_R) * 2 * dt);
  }

  swim.speed = swim.vel.length();
  const speedFrac = swim.speed / MAX_SPEED;

  // Zeeb gently leans into his swim, with a small body wiggle and no craft.
  const pitchTarget = THREE.MathUtils.clamp(-swim.vel.y * 0.06, -0.6, 0.6) - inp.rise * 0.15;
  swim.pitch += (pitchTarget - swim.pitch) * Math.min(1, dt * 5);
  const bankTarget = THREE.MathUtils.clamp(-swim.yawRate * .22 * (.4 + speedFrac), -.58, .58);
  swim.bank += (bankTarget - swim.bank) * (1 - Math.exp(-dt * 12));
  duck.rotation.y = swim.yaw;
  duckTilt.rotation.x = swim.pitch;
  duckTilt.rotation.z = swim.bank * .48;
  const targetRing = rally.rings[rally.state.next];
  const portrait = camera.aspect < .85;
  const insideWreck = reef.wreck.near(duck.position);
  const pilotView = pilotCamera.update(dt, { mode: rally.state.mode, yawRate: swim.yawRate,
    turn: inp.turn, speed: swim.speed, targetDistance: rally.state.mode === 'racing' && targetRing
      ? duck.position.distanceTo(targetRing.position) : Infinity,
    portrait, reducedMotion: !playfulCamera || insideWreck || (touch.active && touch.pointerType !== 'mouse') });
  duckInner.rotation.z = Math.sin(t * 7) * .018 * speedFrac;
  duckInner.rotation.y = pilotView.pilotYaw + Math.sin(t * 6) * .018 * speedFrac;
  duckInner.position.y = SWIM_BODY_Y + Math.sin(t * (2.2 + speedFrac * 3)) * .035;
  rally.afterStep(dt, t);
  reef.update(dt, t);

  // Small breath bubbles and the existing boost trail follow Zeeb himself.
  billPos.copy(duck.position).addScaledVector(fwd, 1.3).add(tmpV.set(0, 0.65, 0));
  if (speedFrac > 0.15 && Math.random() < speedFrac * 0.1) spawnBubble(billPos, rrange(0.08, 0.14));
  else if (Math.random() < 0.02) spawnBubble(billPos, 0.18);

  // Trail bubbles rise, wobble, and fade.
  for (let i = 0; i < TRAIL_N; i++) {
    if (trailLife[i] <= 0) { trailAlpha[i] = 0; continue; }
    trailLife[i] -= dt;
    trailPos[i * 3 + 1] += (1.4 + trailSize[i] * 2) * dt;
    trailPos[i * 3] += Math.sin(t * 5 + i) * 0.15 * dt;
    trailSize[i] += 0.05 * dt;
    trailAlpha[i] = Math.min(0.9, trailLife[i] * 0.5);
    if (trailPos[i * 3 + 1] > SURFACE_Y - 0.5) trailLife[i] = 0;
  }
  trailGeo.attributes.position.needsUpdate = true;
  trailGeo.attributes.aSize.needsUpdate = true;
  trailGeo.attributes.aAlpha.needsUpdate = true;

  // Ambient bubbles rise and wrap to the floor.
  for (let i = 0; i < AMBIENT_N; i++) {
    ambPos[i * 3 + 1] += ambSpeed[i] * dt;
    ambPos[i * 3] += Math.sin(t * 0.8 + i) * 0.2 * dt;
    if (ambPos[i * 3 + 1] > SURFACE_Y - 0.5) ambPos[i * 3 + 1] = FLOOR_Y + 2;
  }
  ambGeo.attributes.position.needsUpdate = true;

  /* --- rings: a soft pulse when Zeeb passes through the hoop --- */
  for (const r of rings) {
    r.hit = Math.max(0, r.hit - dt);
    const m = r.mesh;
    tmpV.copy(duck.position).sub(m.position);
    // Distance from the ring plane and from its axis, in the ring's frame.
    const local = m.worldToLocal(tmpV.clone().add(m.position));
    if (Math.abs(local.z) < 1.2 && Math.hypot(local.x, local.y) < r.R - 0.8 && r.hit === 0) {
      r.hit = 1.2;
      for (let k = 0; k < 14; k++) spawnBubble(duck.position, rrange(0.1, 0.3));
    }
    r.glow.intensity = 12 + r.hit * 60;
    m.material.emissive = m.material.emissive || new THREE.Color();
  }

  /* --- fish --- */
  for (const s of schools) {
    const ph = t * s.speed + s.phase;
    s.prev.copy(s.pos);
    s.pos.set(
      s.center.x + Math.cos(ph) * s.radius,
      s.center.y + Math.sin(ph * 2) * s.bob,
      s.center.z + Math.sin(ph) * s.radius * 0.7
    );
    if (s.prev.lengthSq() > 0) {
      tmpV.subVectors(s.pos, s.prev);
      if (tmpV.lengthSq() > 1e-8) s.dir.lerp(tmpV.normalize(), 0.2).normalize();
    }
    for (let i = 0; i < s.fish.length; i++) {
      const f = s.fish[i];
      // World position of this fish: school center plus its home offset plus
      // its flee offset, with a little bob.
      fishDummy.position.copy(s.pos).add(f.home).add(f.off);
      fishDummy.position.y += Math.sin(t * 2 + f.phase) * 0.3;
      // Flee from Zeeb.
      tmpV.subVectors(fishDummy.position, duck.position);
      const d = tmpV.length();
      if (d < 7) {
        tmpV.normalize().multiplyScalar((7 - d) * 6 * dt);
        f.off.add(tmpV);
      }
      f.off.multiplyScalar(Math.max(0, 1 - 0.8 * dt)); // ease home
      fishDummy.lookAt(tmpV.copy(fishDummy.position).add(s.dir));
      fishDummy.rotation.y += Math.sin(t * 6 + f.phase) * 0.12; // tail wiggle
      fishDummy.scale.setScalar(f.size);
      fishDummy.updateMatrix();
      s.mesh.setMatrixAt(i, fishDummy.matrix);
    }
    s.mesh.instanceMatrix.needsUpdate = true;
  }

  /* --- jellyfish --- */
  for (const j of jellies) {
    const pulse = Math.sin(t * 1.6 + j.phase);
    j.dome.scale.set(1 - pulse * 0.12, 1 + pulse * 0.28, 1 - pulse * 0.12);
    if (j.home) {
      j.g.position.copy(j.home);
      j.g.position.y += Math.sin(t * .55 + j.phase) * 1.2;
      j.g.position.x += Math.sin(t * .2 + j.phase) * 1.4;
      j.g.rotation.y = Math.atan2(duck.position.x - j.g.position.x, duck.position.z - j.g.position.z);
      j.g.rotation.z = Math.sin(t * .5 + j.phase) * .08;
      continue;
    }
    j.g.position.y += j.drift * dt * (0.6 + Math.max(0, pulse));
    j.wander += (Math.random() - 0.5) * dt * 0.4;
    j.g.position.x += Math.cos(j.wander) * 0.35 * dt;
    j.g.position.z += Math.sin(j.wander) * 0.35 * dt;
    j.g.rotation.z = Math.sin(t * 0.5 + j.phase) * 0.15;
    if (j.g.position.y > SURFACE_Y - 3) j.g.position.y = FLOOR_Y + 6;
  }

  /* --- light shafts --- */
  for (const s of shafts) {
    s.position.x = s.userData.baseX + Math.sin(t * 0.15 + s.userData.phase) * 2;
    s.rotation.z = Math.sin(t * 0.1 + s.userData.phase) * 0.1;
  }

  /* --- water color by depth --- */
  const depthFrac = THREE.MathUtils.clamp(-duck.position.y / 60, 0, 1);
  fogNow.copy(shallow).lerp(deep, depthFrac);
  scene.fog.color.copy(fogNow);
  scene.background.copy(fogNow);
  // Clear aqua distance keeps the sculpted reef readable between hoops.
  scene.fog.density = 0.0035 + depthFrac * 0.003;
  hemi.intensity = .8;
  sun.intensity = 3.1;
  if (duck.position.distanceToSquared(shadowAnchor) > 36) {
    shadowAnchor.copy(duck.position);
    sun.target.position.copy(shadowAnchor);
    sun.position.copy(shadowAnchor).add(tmpV.set(-34, 65, 24));
    renderer.shadowMap.needsUpdate = true;
  }

  if (reef.treasure.state.opened && reef.treasure.state.time < 3) renderer.shadowMap.needsUpdate = true;

  /* --- music muffles with depth: 16 kHz open at the surface, 600 Hz deep --- */
  if (music.filter && music.ctx && music.ctx.state === 'running') {
    const cutoff = 600 * Math.pow(16000 / 600, 1 - depthFrac);
    music.filter.frequency.setTargetAtTime(cutoff, music.ctx.currentTime, 0.15);
  }

  /* --- camera: close chase, brief turn glances, and a front-facing welcome --- */
  fwd.set(Math.sin(swim.yaw), 0, Math.cos(swim.yaw));
  const showPilot = pilotView.presentation;
  const orbitYaw = swim.yaw + pilotView.orbit + showPilot * 2.55;
  const chaseDistance = insideWreck ? 6.8 : boosting && !rally.reducedMotion ? 8.6 : 7.8;
  const cameraDistance = THREE.MathUtils.lerp(chaseDistance, portrait ? 6.7 : 5.8, showPilot);
  tmpV.set(-Math.sin(orbitYaw) * cameraDistance, 0, -Math.cos(orbitYaw) * cameraDistance).add(duck.position);
  tmpV.y += THREE.MathUtils.lerp(2.6 - swim.pitch, 1.9, showPilot);
  if (rally.state.mode === 'finished') {
    const frame=reef.treasure.frame(duck.position,portrait);
    const amount=rally.reducedMotion ? 1 : 1-Math.exp(-dt*2.4);
    camPos.lerp(frame.eye,amount);camLook.lerp(frame.look,amount);
  } else {
    // Carry the camera with Zeeb, then ease its orbit. Without this,
    // translation lag adds several feet during a boost and makes Zeeb tiny.
    camPos.addScaledVector(swim.vel, dt * (1 - showPilot));
    camPos.lerp(tmpV, 1 - Math.exp(-dt * (showPilot > .5 ? 4 : 7.5)));
    tmpV.copy(duck.position).addScaledVector(fwd, 2.2 * (1 - showPilot)).addScaledVector(swim.vel, .1 * (1 - showPilot));
    tmpV.y += .5;
    camLook.lerp(tmpV, 1 - Math.exp(-dt * 9));
  }
  // The camera never goes into the sand or through the surface either.
  camPos.y = Math.max(camPos.y, floorY(camPos.x, camPos.z) + 1.5);
  camPos.y = Math.min(camPos.y, SURFACE_Y - 0.8);
  if(dt>0)reef.wreck.clipCamera(cameraOrigin.copy(duck.position).add(new THREE.Vector3(0,.7,0)),camPos);
  camera.position.copy(camPos);
  camera.lookAt(camLook);
  if (!rally.reducedMotion) camera.rotation.z += swim.bank * .08 * (1 - pilotView.amount);
  const targetFov = rally.state.mode === 'finished' ? (portrait ? 58 : 52) : insideWreck ? 68 : THREE.MathUtils.lerp(boosting && !rally.reducedMotion ? 65 : 60, 52, showPilot);
  if (Math.abs(camera.fov - targetFov) > .01) {
    camera.fov += (targetFov - camera.fov) * Math.min(1, dt * 3); camera.updateProjectionMatrix();
  }
  rally.updateGuide();

  renderer.render(scene, camera);

  /* --- HUD --- */
  const depthFt = Math.max(0, Math.round(-duck.position.y));
  if (depthFt !== lastDepthShown) {
    lastDepthShown = depthFt;
    depthEl.innerHTML = `<small>Depth</small>${depthFt} ft`;
  }
  frames++; fpsTimer += dt;
  if (fpsTimer >= 0.5) {
    const info = renderer.info.render;
    // The music state rides along so a phone, with no console, still shows
    // why it is quiet.
    const audio = !music.el ? 'idle'
      : music.el.paused ? 'paused'
      : !graphRunning() ? music.ctx.state
      : music.ctx ? 'playing' : 'playing, plain';
    perfEl.textContent = `${Math.round(frames / fpsTimer)} fps · ${info.calls} draws · music ${audio}`;
    frames = 0; fpsTimer = 0;
  }

  requestAnimationFrame(animate);
}
requestAnimationFrame(animate);

// Debug handle for the console or a driving script.
window.__ocean = { scene, camera, renderer, duck, swim, keys, THREE, floorY, music, rally, reef, touch, controls, pilotCamera,
  // Fixed views let artwork iterations be compared at the same camera and time.
  reviewView({ position, yaw = 0, eye, target, hoop = 0, fov = 60 }) {
    keys.clear(); controls.clear();
    rally.state.mode = 'paused'; rally.state.pausedMode = 'explore'; rally.state.next = hoop;
    rally.state.boost = 0; rally.refreshRings();
    document.body.classList.add('preview');
    duck.position.set(...position); swim.vel.set(0, 0, 0);
    swim.yaw = yaw; swim.yawRate = swim.pitch = swim.bank = swim.speed = 0;
    Object.assign(pilotCamera.state, { phase: 0, amount: 0, orbit: 0, pilotYaw: 0, presentation: 0 });
    elapsed = 12; timeUniform.value = elapsed;
    camPos.set(...eye); camLook.set(...target); camera.fov = fov; camera.updateProjectionMatrix();
  }
};
</script>
</body>
