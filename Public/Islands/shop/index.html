<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Surfboard Shop - Zeeb's Island Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body {
            min-height: 100%; min-height: 100dvh;
            overflow-y: auto;
            background: #0e3d5e;
            font-family: 'Lilita One', Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        body {
            background: linear-gradient(180deg, #0e3d5e, #1b6a9a, #2486b5, #3ab8e0, #1b6a9a, #0e3d5e);
            background-size: 100% 300%;
            position: relative;
            overflow: hidden;
            animation: oceanDrift 12s ease-in-out infinite alternate;
        }

        @keyframes oceanDrift {
            0%   { background-position: 50% 0%; }
            100% { background-position: 50% 100%; }
        }

        /* Caustic light layers */
        body::before {
            content: '';
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse 600px 300px at 30% 40%, rgba(100,210,255,0.18), transparent),
                radial-gradient(ellipse 500px 250px at 70% 60%, rgba(0,180,220,0.15), transparent),
                radial-gradient(ellipse 400px 350px at 50% 30%, rgba(60,200,240,0.12), transparent),
                radial-gradient(ellipse 550px 280px at 20% 70%, rgba(0,160,200,0.10), transparent);
            pointer-events: none;
            animation: waterMove 8s ease-in-out infinite alternate;
        }

        @keyframes waterMove {
            0%   { transform: translate(0, 0) rotate(0deg); }
            33%  { transform: translate(2%, -1.5%) rotate(0.5deg); }
            66%  { transform: translate(-1.5%, 1%) rotate(-0.3deg); }
            100% { transform: translate(1%, -0.5%) rotate(0.2deg); }
        }

        body::after {
            content: '';
            position: fixed;
            inset: -50%;
            width: 200%;
            height: 200%;
            background:
                radial-gradient(ellipse 450px 200px at 60% 50%, rgba(255,255,255,0.06), transparent),
                radial-gradient(ellipse 350px 300px at 35% 65%, rgba(80,200,240,0.10), transparent),
                radial-gradient(ellipse 500px 220px at 75% 35%, rgba(255,255,255,0.05), transparent);
            pointer-events: none;
            animation: waterMove2 10s ease-in-out infinite alternate;
        }

        @keyframes waterMove2 {
            0%   { transform: translate(0, 0) rotate(0deg); }
            50%  { transform: translate(-2%, 1.5%) rotate(-0.4deg); }
            100% { transform: translate(1.5%, -1%) rotate(0.3deg); }
        }

        /* Vignette overlay */
        .vignette {
            position: fixed;
            inset: 0;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(5,20,40,0.45) 100%);
        }

        /* Light rays from top */
        .light-rays {
            position: fixed;
            top: -30%;
            left: -10%;
            width: 120%;
            height: 80%;
            pointer-events: none;
            z-index: 0;
            background:
                conic-gradient(from 260deg at 50% 0%,
                    transparent 0deg, rgba(255,255,255,0.03) 2deg, transparent 5deg,
                    transparent 15deg, rgba(255,255,255,0.04) 17deg, transparent 20deg,
                    transparent 32deg, rgba(255,255,255,0.03) 34deg, transparent 37deg,
                    transparent 48deg, rgba(255,255,255,0.05) 50deg, transparent 53deg,
                    transparent 65deg, rgba(255,255,255,0.03) 67deg, transparent 70deg,
                    transparent 80deg
                );
            opacity: 0.7;
            animation: rayShift 20s ease-in-out infinite alternate;
        }

        @keyframes rayShift {
            0%   { transform: rotate(-3deg) scaleX(1); }
            100% { transform: rotate(3deg) scaleX(1.1); }
        }

        /* === SHOP LAYOUT === */
        .shop {
            position: relative;
            z-index: 2;
            text-align: center;
            padding: 20px;
            max-width: 800px;
            width: 100%;
            animation: shopEnter 0.8s cubic-bezier(.23,1,.32,1) both;
        }

        @keyframes shopEnter {
            from { opacity: 0; transform: translateY(30px) scale(0.97); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* === TITLE === */
        .shop-title {
            font-size: clamp(32px, 7vw, 56px);
            margin-bottom: 6px;
            color: #fff;
            -webkit-text-stroke: 1.5px rgba(0,60,120,0.4);
            text-shadow:
                0 2px 8px rgba(0,0,0,0.4),
                0 0 30px rgba(100,200,255,0.15);
            animation: titleDrop 0.7s cubic-bezier(.23,1,.32,1) both;
            position: relative;
            display: inline-block;
        }

        @keyframes titleDrop {
            from { opacity: 0; transform: translateY(-20px) scale(1.1); }
            to   { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* Shimmer sweep across title */
        .shop-title::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.35) 50%, transparent 70%);
            animation: titleShimmer 0.8s ease-in-out 1.2s both;
            pointer-events: none;
        }

        @keyframes titleShimmer {
            from { left: -100%; }
            to   { left: 160%; }
        }

        /* === COIN BALANCE === */
        .coin-balance {
            font-size: clamp(20px, 4vw, 32px);
            color: #ffd700;
            text-shadow: 1px 2px 4px rgba(0,0,0,0.4);
            margin-bottom: 24px;
            animation: shopEnter 0.8s cubic-bezier(.23,1,.32,1) 0.15s both;
        }

        .coin-icon {
            display: inline-block;
            width: 28px;
            height: 28px;
            vertical-align: middle;
            margin-right: 4px;
            animation: coinSpin 1s cubic-bezier(.23,1,.32,1) 0.6s both;
        }

        @keyframes coinSpin {
            from { transform: rotateY(180deg) scale(0.5); opacity: 0; }
            to   { transform: rotateY(0deg) scale(1); opacity: 1; }
        }

        /* === BOARD GRID === */
        .boards {
            display: flex;
            justify-content: center;
            gap: clamp(12px, 3vw, 28px);
            flex-wrap: wrap;
            margin-bottom: 28px;
        }

        /* === BOARD CARDS === */
        .board-card {
            background: linear-gradient(170deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.06) 100%);
            border: 3px solid rgba(255,255,255,0.3);
            border-radius: 18px;
            padding: 14px 12px 14px;
            width: clamp(120px, 20vw, 150px);
            cursor: pointer;
            transition: transform 0.25s cubic-bezier(.23,1,.32,1), border-color 0.2s, background 0.2s, box-shadow 0.25s;
            position: relative;
            box-shadow: 0 4px 16px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.2);
            overflow: hidden;
            /* Stagger entrance — set via JS */
            animation: cardPop 0.5s cubic-bezier(.23,1,.32,1) both;
        }

        @keyframes cardPop {
            from { opacity: 0; transform: translateY(40px) scale(0.85) rotate(-2deg); }
            to   { opacity: 1; transform: translateY(0) scale(1) rotate(0deg); }
        }

        /* Idle bob — like floating on water */
        .board-card.idle {
            animation: cardBob 3s ease-in-out infinite;
        }

        @keyframes cardBob {
            0%, 100% { transform: translateY(0); }
            50%      { transform: translateY(-4px); }
        }

        /* Shine glint sweep */
        .board-card::before {
            content: '';
            position: absolute;
            top: 0; left: -75%;
            width: 50%;
            height: 100%;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.12) 50%, transparent 70%);
            transition: none;
            pointer-events: none;
            z-index: 1;
        }

        .board-card:hover::before, .board-card.selected::before {
            animation: cardShine 0.6s ease-out forwards;
        }

        @keyframes cardShine {
            to { left: 150%; }
        }

        .board-card:hover:not(.locked) {
            transform: translateY(-8px) scale(1.05);
            border-color: rgba(255,255,255,0.7);
            background: linear-gradient(170deg, rgba(255,255,255,0.30) 0%, rgba(255,255,255,0.12) 100%);
            box-shadow: 0 12px 32px rgba(0,0,0,0.35), inset 0 1px 0 rgba(255,255,255,0.3);
        }

        .board-card.selected {
            border-color: #ffd700;
            background: linear-gradient(170deg, rgba(255,215,0,0.28) 0%, rgba(255,215,0,0.10) 100%);
            transform: translateY(-8px) scale(1.05);
            box-shadow:
                0 0 20px rgba(255,215,0,0.25),
                0 8px 28px rgba(0,0,0,0.3),
                inset 0 1px 0 rgba(255,255,255,0.25);
        }

        /* Golden check badge on selected */
        .board-card .check-badge {
            position: absolute;
            top: -6px;
            right: -6px;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, #ffdc40, #f5a623);
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            z-index: 2;
            transform: scale(0);
            transition: transform 0.3s cubic-bezier(.34,1.56,.64,1);
        }

        .board-card.selected .check-badge {
            transform: scale(1);
        }

        /* === LOCKED STATE === */
        .board-card.locked {
            cursor: not-allowed;
        }

        .board-card.locked .board-img {
            filter: saturate(0.6) brightness(0.85);
        }

        .board-card.locked .board-price {
            color: #ffaa00;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.7);
        }

        .board-card.locked::after {
            content: 'Need more coins!';
            display: block;
            position: relative;
            margin-top: 8px;
            font-size: 13px;
            color: #fff;
            background: linear-gradient(135deg, #e05555, #c03030);
            border-radius: 8px;
            padding: 4px 10px;
            font-family: 'Lilita One', Arial, sans-serif;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.4);
            box-shadow: 0 2px 6px rgba(0,0,0,0.25);
            white-space: nowrap;
        }

        /* === BOARD IMAGE === */
        .board-img {
            width: 100%;
            height: auto;
            border-radius: 10px;
            margin-bottom: 10px;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.35));
            transition: filter 0.2s, transform 0.3s cubic-bezier(.23,1,.32,1);
        }

        .board-card:hover:not(.locked) .board-img,
        .board-card.selected .board-img {
            filter: drop-shadow(0 6px 12px rgba(0,0,0,0.4));
            transform: scale(1.03);
        }

        .board-name {
            font-size: clamp(14px, 2.5vw, 19px);
            text-shadow: 1px 1px 3px rgba(0,0,0,0.4);
            margin-bottom: 4px;
        }

        .board-price {
            font-size: clamp(13px, 2.2vw, 17px);
            color: #ffe44d;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.5);
        }

        .board-price.free {
            color: #7dff7d;
        }

        /* === GO BUTTON === */
        .go-btn {
            display: inline-block;
            padding: 14px 48px;
            border-radius: 14px;
            border: 2px solid rgba(255,255,255,0.5);
            background: linear-gradient(180deg, #2e9e42, #1a6a2a);
            color: white;
            font-family: 'Lilita One', Arial, sans-serif;
            font-size: clamp(20px, 4vw, 28px);
            cursor: pointer;
            text-shadow: 1px 2px 3px rgba(0,0,0,0.4);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
            transition: transform 0.15s, box-shadow 0.15s;
            position: relative;
            overflow: hidden;
            animation: shopEnter 0.8s cubic-bezier(.23,1,.32,1) 0.7s both;
        }

        /* Sweeping shine on button */
        .go-btn::after {
            content: '';
            position: absolute;
            top: 0; left: -100%;
            width: 60%;
            height: 100%;
            background: linear-gradient(105deg, transparent 30%, rgba(255,255,255,0.2) 50%, transparent 70%);
            pointer-events: none;
        }

        .go-btn.ready::after {
            animation: btnShine 3s ease-in-out 0.5s infinite;
        }

        @keyframes btnShine {
            0%, 100% { left: -100%; }
            30%, 50% { left: 160%; }
        }

        .go-btn:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 10px 28px rgba(0,0,0,0.4);
        }

        .go-btn:active {
            transform: translateY(1px) scale(0.98);
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
        }

        .go-btn.ready {
            animation: btnPulse 2s ease-in-out infinite;
            border-color: rgba(255,230,100,0.6);
        }

        @keyframes btnPulse {
            0%, 100% { transform: scale(1); box-shadow: 0 6px 20px rgba(0,0,0,0.3), 0 0 0 0 rgba(50,200,80,0); }
            50%      { transform: scale(1.04); box-shadow: 0 8px 28px rgba(50,180,80,0.35), 0 0 15px 2px rgba(50,200,80,0.15); }
        }

        .go-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none;
        }

        /* === FLOATIES === */
        .floaty {
            position: fixed;
            pointer-events: none;
            z-index: 0;
            opacity: 0;
            animation: floatUp linear infinite;
        }

        .floaty.bubble {
            color: rgba(200,230,255,0.5);
            text-shadow: 0 0 6px rgba(255,255,255,0.4);
        }

        .floaty.sway {
            animation: floatUpSway linear infinite;
        }

        @keyframes floatUp {
            0%   { transform: translateY(0) rotate(0deg) scale(0.8); opacity: 0; }
            5%   { opacity: 0.85; }
            85%  { opacity: 0.85; }
            100% { transform: translateY(-110vh) rotate(360deg) scale(1.1); opacity: 0; }
        }

        @keyframes floatUpSway {
            0%   { transform: translateY(0) translateX(0) rotate(0deg); opacity: 0; }
            5%   { opacity: 0.8; }
            25%  { transform: translateY(-25vh) translateX(35px) rotate(90deg); opacity: 0.8; }
            50%  { transform: translateY(-50vh) translateX(-25px) rotate(180deg); opacity: 0.8; }
            75%  { transform: translateY(-75vh) translateX(30px) rotate(270deg); opacity: 0.75; }
            100% { transform: translateY(-110vh) translateX(-15px) rotate(360deg); opacity: 0; }
        }

        /* === MOBILE === */
        @media (max-width: 500px) {
            .boards {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
                padding: 0 8px;
            }
            .board-card {
                width: 100%;
                padding: 10px 8px 16px;
            }
            .shop { padding: 16px 4px; }
            .coin-balance { margin-bottom: 16px; }
            .go-btn { padding: 12px 36px; }
        }
    </style>
</head>
<body>
    <div class="light-rays"></div>
    <div class="vignette"></div>

    <div class="shop">
        <h1 class="shop-title">Pick Your Board!</h1>
        <p class="coin-balance">
            <img class="coin-icon" src="../img/coin.png" alt="coin">
            <span id="coinBalance">0</span> coins
        </p>

        <div class="boards" id="boardGrid"></div>

        <button class="go-btn" id="goBtn" disabled>Surf's Up!</button>
    </div>

    <script>
    (function() {
        const coins = parseInt(localStorage.getItem('zeeb_coins') || '0', 10);
        document.getElementById('coinBalance').textContent = coins;

        const boards = [
            { color: 'red',    name: 'Red',    price: 0,  file: 'red.png' },
            { color: 'green',  name: 'Green',  price: 25, file: 'green.png' },
            { color: 'purple', name: 'Purple', price: 30, file: 'purple.png' },
            { color: 'blue',   name: 'Blue',   price: 45, file: 'blue.png' },
        ];

        const grid = document.getElementById('boardGrid');
        const goBtn = document.getElementById('goBtn');
        let selected = null;

        boards.forEach((b, idx) => {
            const card = document.createElement('div');
            card.className = 'board-card';
            card.style.animationDelay = (0.25 + idx * 0.1) + 's';
            const canAfford = coins >= b.price;
            if (!canAfford) card.classList.add('locked');

            // Add check badge (hidden until selected)
            card.innerHTML = `
                <div class="check-badge">&#10003;</div>
                <img class="board-img" src="../img/${b.file}" alt="${b.name} surfboard">
                <div class="board-name">${b.name}</div>
                <div class="board-price ${b.price === 0 ? 'free' : ''}">
                    ${b.price === 0 ? 'Free!' : b.price + ' coins'}
                </div>
            `;

            // Start idle bob after entrance
            card.addEventListener('animationend', (e) => {
                if (e.animationName === 'cardPop') {
                    card.classList.add('idle');
                    // Offset each card's bob so they don't sync
                    card.style.animationDelay = (idx * 0.4) + 's';
                }
            }, { once: true });

            if (canAfford) {
                card.addEventListener('click', () => {
                    document.querySelectorAll('.board-card').forEach(c => {
                        c.classList.remove('selected');
                        // Reset shine
                        c.querySelector('::before');
                    });
                    card.classList.add('selected');
                    selected = b;
                    goBtn.disabled = false;
                    goBtn.classList.add('ready');
                });
            }

            grid.appendChild(card);
        });

        goBtn.addEventListener('click', () => {
            if (!selected) return;
            const remaining = coins - selected.price;
            localStorage.setItem('zeeb_coins', remaining.toString());
            localStorage.setItem('zeeb_board', selected.file);
            window.location.href = '../level2/index.html';
        });
    })();

    // Shop music
    (function() {
        const music = document.createElement('audio');
        music.src = '../Audio/Zeeb Islands - Pick Your Surfboard.m4a';
        music.loop = true;
        music.preload = 'auto';
        music.volume = 0;

        let fading = false;
        function fadeIn() {
            if (fading) return;
            fading = true;
            const fade = setInterval(() => {
                if (music.volume < 0.8) music.volume = Math.min(0.8, music.volume + 0.02);
                else clearInterval(fade);
            }, 50);
        }

        function tryPlay() {
            music.play().then(fadeIn).catch(() => {});
        }

        // Try autoplay immediately
        tryPlay();

        // Also hook every interaction as fallback
        function unlock() {
            tryPlay();
            document.removeEventListener('click', unlock, true);
            document.removeEventListener('touchstart', unlock, true);
            document.removeEventListener('keydown', unlock, true);
        }
        document.addEventListener('click', unlock, true);
        document.addEventListener('touchstart', unlock, true);
        document.addEventListener('keydown', unlock, true);
    })();

    // URL param override for testing: ?coins=50
    (function() {
        const params = new URLSearchParams(window.location.search);
        const testCoins = params.get('coins');
        if (testCoins !== null) {
            localStorage.setItem('zeeb_coins', testCoins);
            // Update display
            const bal = document.querySelector('.coin-balance');
            if (bal) bal.innerHTML = bal.innerHTML.replace(/\d+/, testCoins);
        }
    })();

    // Floaty background critters
    (function() {
        const MAX = 30;
        let count = 0;

        function spawn(immediate) {
            if (count >= MAX) return;
            const el = document.createElement('span');
            el.className = 'floaty' + (Math.random() > 0.5 ? ' sway' : '') + ' bubble';
            el.textContent = '○';
            const size = 8 + Math.random() * 28;
            const dur = 8 + Math.random() * 18;
            el.style.cssText = `
                left: ${Math.random() * 92}%;
                bottom: -40px;
                font-size: ${size}px;
                animation-duration: ${dur}s;
                animation-delay: ${immediate ? -(Math.random() * dur) : 0}s;
            `;
            document.body.appendChild(el);
            count++;
            el.addEventListener('animationiteration', () => {
                el.style.left = Math.random() * 92 + '%';
            });
            el.addEventListener('animationend', () => {
                el.remove();
                count--;
            });
        }

        // Immediate batch — already mid-flight
        for (let i = 0; i < 20; i++) spawn(true);
        // Keep spawning
        setInterval(() => spawn(false), 800);
    })();
    </script>
</body>
</html>
