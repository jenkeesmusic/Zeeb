<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zeeb's Island Adventure - Beach Walk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Boogaloo&family=Lilita+One&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%;
            overflow: hidden;
            background: #000;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* ─── End-of-content cutscene video ─── */
        .video-overlay {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .video-overlay.hidden { display: none; }
        .video-overlay video {
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #000;
        }
        .skip-btn {
            position: fixed;
            bottom: 28px;
            right: 28px;
            z-index: 201;
            padding: 10px 20px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.5);
            color: rgba(255, 255, 255, 0.6);
            font-family: 'Lilita One', Arial, sans-serif;
            font-size: 15px;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: color 0.2s, border-color 0.2s, background 0.2s;
            opacity: 0;
            animation: skip-fade-in 1s ease 2s forwards;
        }
        .skip-btn:hover {
            color: rgba(255, 255, 255, 0.95);
            border-color: rgba(255, 255, 255, 0.6);
            background: rgba(0, 0, 0, 0.7);
        }
        @keyframes skip-fade-in {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        /* Shown when the browser blocks autoplay — a real tap always works */
        .tap-to-play {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 202;
            padding: 22px 44px;
            border: none;
            border-radius: 999px;
            background: #ff8a3d;
            color: #fff;
            font-family: 'Lilita One', Arial, sans-serif;
            font-size: clamp(20px, 5vw, 28px);
            letter-spacing: 0.02em;
            cursor: pointer;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.6), 0 0 0 6px rgba(255, 255, 255, 0.15);
            -webkit-tap-highlight-color: transparent;
            animation: tap-pulse 1.4s ease-in-out infinite;
        }
        .tap-to-play.hidden { display: none; }
        @keyframes tap-pulse {
            0%, 100% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.06); }
        }

        /* ─── "You've reached the end" screen ─── */
        .end-screen {
            position: fixed;
            inset: 0;
            z-index: 200;
            background: rgba(10, 20, 40, 0.94);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 24px;
            font-family: 'Lilita One', Arial, sans-serif;
            color: #fff;
        }
        .end-screen.hidden { display: none; }
        .end-screen h2 {
            font-size: clamp(24px, 5vw, 40px);
            margin-bottom: 14px;
            color: #ffd35c;
            text-shadow: 0 3px 0 rgba(0,0,0,0.4);
        }
        .end-screen p {
            font-family: 'Boogaloo', Arial, sans-serif;
            font-size: clamp(16px, 3vw, 22px);
            max-width: 480px;
            margin-bottom: 32px;
            line-height: 1.4;
        }
        .end-screen-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            justify-content: center;
        }
        .end-screen-buttons button {
            font-family: 'Lilita One', Arial, sans-serif;
            font-size: 18px;
            padding: 14px 28px;
            border-radius: 10px;
            border: none;
            cursor: pointer;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
        }
        #battleBtn { background: #e85c8a; }
        #battleBtn:hover { background: #f0729c; }
        #backToGameBtn { background: #3ecf8e; }
        #backToGameBtn:hover { background: #55dba0; }
        #restartBtn { background: #ff8a3d; }
        #restartBtn:hover { background: #ff9c5c; }
        #mainMenuBtn { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.4); }
        #mainMenuBtn:hover { background: rgba(255,255,255,0.25); }
    </style>
</head>
<body>
    <canvas id="gameCanvas"></canvas>

    <div id="endVideoOverlay" class="video-overlay hidden">
        <video id="endVideo" playsinline preload="auto">
            <source src="../video/cucumbers-great-return.mp4" type="video/mp4">
        </video>
        <button id="tapToPlay" class="tap-to-play hidden">Tap to Play</button>
        <button id="skipEndVideo" class="skip-btn">Skip</button>
    </div>

    <div id="endScreen" class="end-screen hidden">
        <h2>The Octopus is waiting...</h2>
        <p>Grab your board. Jump the splash waves. 40 coins wins the battle!</p>
        <div class="end-screen-buttons">
            <button id="battleBtn">Battle the Octopus</button>
            <button id="backToGameBtn">Keep Exploring</button>
            <button id="mainMenuBtn">Main Menu</button>
        </div>
    </div>

    <script src="game.js?v=20260808a"></script>
</body>
</html>
